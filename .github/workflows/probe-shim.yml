name: Probe Shim Image

# 探针分支专用：构建含 opencode 层的镜像并试运行，不断言上游 200/403
# （GH runner 出口 IP 与 Railway 不同，只验证镜像本身 + 记录上游状态码）。
on:
  push:
    branches: ["probe-shim"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: shim-probe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name shim-probe \
            -p 4096:4096 \
            -e TUNNEL_TOKEN=dummy-ci-token \
            -e SHIM_CONCURRENCY=1 \
            shim-probe:ci
          sleep 5
          docker ps --filter name=shim-probe

      - name: Assert opencode present
        run: docker exec shim-probe opencode --version

      - name: Wait gateway healthy
        run: |
          for i in $(seq 1 30); do
            if curl -s --max-time 5 http://127.0.0.1:4096/health; then
              echo ""; echo "gateway ok (try $i)"; exit 0
            fi
            sleep 4
          done
          echo "gateway never healthy"; docker logs shim-probe 2>&1 | tail -n 50; exit 1

      - name: Tiny shim request (informational, never fails job)
        run: |
          code=$(curl -s -m 240 -o /tmp/probe-resp.json -w "%{http_code}" \
            http://127.0.0.1:4096/v1/responses \
            -H 'Content-Type: application/json' -H 'User-Agent: probe-ci/1.0' \
            -d '{"model":"test/muse-spark-1.3-contributor-free","stream":false,"input":[{"role":"user","content":"reply with exactly one word: ok"}]}') || code="curl-fail"
          echo "PROBE_HTTP=$code"
          head -c 500 /tmp/probe-resp.json; echo ""
          echo "PROBE_HTTP=$code" >> "$GITHUB_STEP_SUMMARY"

      - name: Dump container logs
        if: always()
        run: docker logs shim-probe 2>&1 | tail -n 80

      - name: Cleanup
        if: always()
        run: docker rm -f shim-probe || true
